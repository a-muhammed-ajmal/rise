<style>

            border-color: theme('colors.primary-container');
        }

            content: '';
            position: absolute;
            top: 50%;
            left: 50%;

            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            margin-top: -1px;

            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.4);
        }
