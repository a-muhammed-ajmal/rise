<style>
        .graph-bg {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);

        }
        
        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }

            border-color: #ff6535;

            outline: none;
        }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background font-body-md h-screen w-screen overflow-hidden flex flex-col relative graph-bg">
<!-- Mock Background Content to blur -->
<div class="absolute inset-0 p-8 flex flex-col gap-6 opacity-40 blur-sm pointer-events-none">
<div class="h-32 bg-surface-container rounded-xl w-full border border-white/5"></div>
<div class="flex gap-6 w-full">
<div class="h-64 bg-surface-container rounded-xl w-1/2 border border-white/5"></div>
<div class="h-64 bg-surface-container rounded-xl w-1/2 border border-white/5"></div>
</div>
</div>
<!-- Bottom Sheet Modal Container -->
<div class="absolute inset-0 z-50 flex flex-col justify-end bg-black/40 backdrop-blur-md">
<!-- Bottom Sheet Content -->
<div class="bg-surface-container-low w-full md:w-[600px] md:mx-auto md:mb-8 rounded-t-[24px] md:rounded-[24px] flex flex-col shadow-[0_-8px_30px_rgba(0,0,0,0.6)] border-t border-x border-white/10 md:border-b max-h-[795px] overflow-hidden">
<!-- Handle (Mobile) -->
<div class="w-full flex justify-center pt-4 pb-2 md:hidden">
<div class="w-12 h-1.5 bg-white/20 rounded-full"></div>
</div>
<!-- Header -->
<div class="flex items-center justify-between px-6 py-4 border-b border-white/5 relative">
<div class="w-8 h-8"></div> <!-- Spacer for centering -->
<h2 class="font-headline-sm text-headline-sm text-on-surface">New Goal</h2>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Scrollable Body -->
<div class="p-6 flex flex-col gap-8 overflow-y-auto custom-scrollbar">
<!-- Title Input -->
<div class="flex flex-col gap-2">
<input autofocus="" class="w-full bg-transparent border-b-2 border-white/10 hover:border-white/20 focus:border-primary-container text-headline-md font-headline-md placeholder:text-on-surface-variant/40 px-2 py-3 transition-colors outline-none text-on-surface" placeholder="Goal Title" type="text"/>
</div>
<!-- Categories -->
<div class="flex flex-col gap-3">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Category</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full font-label-md text-label-md bg-primary-container text-white border border-primary-container/20 shadow-[0_0_15px_rgba(255,101,53,0.3)] transition-all">Career</button>
<button class="px-4 py-2 rounded-full font-label-md text-label-md bg-surface-bright text-on-surface-variant border border-white/5 hover:border-white/20 transition-all">Health</button>
<button class="px-4 py-2 rounded-full font-label-md text-label-md bg-surface-bright text-on-surface-variant border border-white/5 hover:border-white/20 transition-all">Finance</button>
<button class="px-4 py-2 rounded-full font-label-md text-label-md bg-surface-bright text-on-surface-variant border border-white/5 hover:border-white/20 transition-all">Personal</button>
<button class="px-4 py-2 rounded-full font-label-md text-label-md bg-surface-bright text-on-surface-variant border border-white/5 hover:border-white/20 transition-all">Learning</button>
</div>
</div>
<!-- Target Date -->
<div class="flex flex-col gap-3">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Target Date</label>
<button class="flex items-center gap-2 w-fit px-4 py-2.5 rounded-lg bg-surface-bright border border-white/5 hover:border-white/20 transition-all text-on-surface">
<span class="material-symbols-outlined text-primary-fixed-dim" style="font-size: 20px;">calendar_month</span>
<span class="font-body-md">Dec 31, 2024</span>
</button>
</div>
<!-- Milestones -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Milestones</label>
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-on-surface-variant transition-colors border border-white/10">
<span class="material-symbols-outlined" style="font-size: 16px;">add</span>
</button>
</div>
<div class="flex flex-col gap-2">
<div class="flex items-center gap-3 glass-input rounded-lg px-4 py-3">
<div class="w-4 h-4 rounded-full border border-white/20 flex-shrink-0"></div>
<input class="bg-transparent border-none p-0 w-full font-body-md text-on-surface focus:ring-0 outline-none placeholder:text-on-surface-variant/40" placeholder="Add a milestone..." type="text"/>
</div>
<div class="flex items-center gap-3 glass-input rounded-lg px-4 py-3">
<div class="w-4 h-4 rounded-full border border-white/20 flex-shrink-0"></div>
<input class="bg-transparent border-none p-0 w-full font-body-md text-on-surface focus:ring-0 outline-none placeholder:text-on-surface-variant/40" placeholder="Add a milestone..." type="text"/>
</div>
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-3 pb-6">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Description</label>
<textarea class="w-full glass-input rounded-lg px-4 py-3 font-body-md text-on-surface placeholder:text-on-surface-variant/40 min-h-[100px] resize-none outline-none focus:ring-0" placeholder="Add details about your goal..."></textarea>
</div>
</div>
<!-- Footer Action -->
<div class="p-6 border-t border-white/5 bg-surface-container-low/95 backdrop-blur-xl">
<button class="w-full py-4 rounded-xl bg-primary-container text-white font-headline-sm text-headline-sm flex items-center justify-center gap-2 hover:bg-primary-container/90 transition-all active:scale-[0.98] shadow-[0_4px_20px_rgba(255,101,53,0.3)]">
                    Create Goal
                    <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</div>
</div>
</div>
